name: Build and release launcher

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate version tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:RELEASE_TAG' is not a supported version. Use 1.2.3 or v1.2.3 (optionally with a prerelease suffix)."
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained launcher
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          dotnet publish "GameLauncher/FFReStart GameLauncher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:RELEASE_VERSION

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Move-Item `
            -LiteralPath "publish/FFReStart GameLauncher.exe" `
            -Destination "release/FFReStart-Launcher-$env:RELEASE_TAG-win-x64.exe"

      - name: Create GitHub Release and upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = "release/FFReStart-Launcher-$tag-win-x64.exe"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset `
              --verify-tag `
              --generate-notes `
              --title "FFReStart Launcher $tag" `
              --repo $env:GITHUB_REPOSITORY
          }
