name: Wails launcher

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@9.15.1
      - name: Build frontend
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend run typecheck && pnpm --dir frontend run build
      - name: Vet and test Go
        run: go vet ./... && go test ./...
      - name: Lint Go
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 && golangci-lint run

  windows-build:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@9.15.1
      - name: Install frontend
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build Windows launcher
        run: wails build -platform windows/amd64 -clean

  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Linux launcher with WebKitGTK 4.1
        run: docker build --file build/linux.Dockerfile --output type=local,dest=build/linux-out .
